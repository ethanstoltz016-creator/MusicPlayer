<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music Player</title>
  <button type="button" class="color-btn" onclick="changeColor()">Dark Mode</button>
    <script>
    function changeColor() {
        // Toggle the entire dark-mode component architecture switch seamlessly
        document.body.classList.toggle('dark-mode');
    }
    </script>
  <!-- <link rel="stylesheet" href="src\main\resources\styles.css"> -->
  <link rel="stylesheet" href="resources\styles.css">
</head>
<body>
  <main class="player-shell">
    <header>
      <p class="eyebrow">PERSONAL MUSIC LIBRARY</p>
      <h1>Music Player</h1>
      <p class="now-playing" id="nowPlaying">Choose a song to begin</p>
    </header>

    <section class="player-panel" aria-label="Music player">
      <audio id="audio" controls preload="metadata"></audio>
      <div class="controls">
        <button id="previousButton" type="button">Previous</button>
        <button id="playButton" type="button">Play</button>
        <button id="nextButton" type="button">Next</button>
        <button id="shuffleButton" type="button" aria-pressed="false">Shuffle: Off</button>
      </div>
    </section>

    <section class="library-panel">
      <div class="section-heading">
        <div>
          <p class="eyebrow">YOUR QUEUE</p>
          <h2>Playlist</h2>
        </div>
        <label class="volume-control">Volume
          <input id="volume" type="range" min="0" max="1" step="0.01" value="0.5">
        </label>
      </div>

      <div class="file-tools">
        <label class="folder-picker">
          <span>Browse a music folder</span>
          <input id="folderInput" type="file" accept="audio/*" webkitdirectory directory multiple>
        </label>
        <label class="file-picker">
          <span>Add music files</span>
          <input id="fileInput" type="file" accept="audio/*" multiple>
        </label>
      </div>
      <p class="help-text">Select a folder or files from your device. The browser keeps selected local music private to this page.</p>

      <!-- Updated playlist container to handle title and duration child nodes -->
      <ol id="playlist" class="playlist" aria-label="Playlist">
        <!-- 
          Your app.js script will dynamically inject items matching this structure:
          <li class="playlist-item">
            <span class="track-title">Song Title Name</span>
            <span class="track-duration">03:45</span>
          </li>
        -->
      </ol>
      <p id="emptyMessage" class="empty-message" hidden>No songs loaded yet.</p>
    </section>
  </main>
  <script src="resources\app.js"></script>
</body>
</html>
